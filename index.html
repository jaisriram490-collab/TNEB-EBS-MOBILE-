<script>
/* =========================================================
   TNEB FEEDER ASSET GIS
   Firebase Realtime Database + Leaflet
   ========================================================= */

const FIREBASE_ENDPOINT =
  "https://tneb-gis-70e97-default-rtdb.asia-southeast1.firebasedatabase.app/tneb_network_assets.json";

const LOCAL_KEY = "tneb_asset_v17";

/* ---------------------------------------------------------
   Default data - used only if Firebase is empty/unavailable
   --------------------------------------------------------- */
const defaultSeed = [
  {
    id: "ast_1",
    Mobile_Unit: "Mobile-1",
    Substation: "Guindy 110kV SS",
    Feeder: "Industrial Feeder",
    Branch: "Main",
    SubBranch: "",
    AE_Section: "AE/Guindy",
    Asset_Type: "RMU",
    Asset_Name: "RMU 01 (Post Office)",
    Sequence_No: 1,
    Latitude: 13.0080,
    Longitude: 80.2040,
    Tie_Feeder: "",
    Remarks: "3-Way SF6"
  },
  {
    id: "ast_2",
    Mobile_Unit: "Mobile-1",
    Substation: "Guindy 110kV SS",
    Feeder: "Industrial Feeder",
    Branch: "Main",
    SubBranch: "",
    AE_Section: "AE/Guindy",
    Asset_Type: "Structure",
    Asset_Name: "DP Pole 04",
    Sequence_No: 2,
    Latitude: 13.0092,
    Longitude: 80.2052,
    Tie_Feeder: "",
    Remarks: "250kVA DT"
  },
  {
    id: "ast_3",
    Mobile_Unit: "Mobile-1",
    Substation: "Guindy 110kV SS",
    Feeder: "Industrial Feeder",
    Branch: "Branch-1",
    SubBranch: "",
    AE_Section: "AE/Guindy",
    Asset_Type: "RMU",
    Asset_Name: "RMU 02 (Cross Tie)",
    Sequence_No: 3,
    Latitude: 13.0118,
    Longitude: 80.2078,
    Tie_Feeder: "Bazaar Feeder",
    Remarks: "Normally Open Tie"
  }
];

/* ---------------------------------------------------------
   Application state
   --------------------------------------------------------- */

let masterData = [];

let map = null;
let markerLayer = null;
let pathLayer = null;
let firebaseStream = null;

let isPinModeActive = false;
let firebaseReady = false;
let isSaving = false;


/* =========================================================
   INITIALIZE MAP
   ========================================================= */

function initializeMap() {

  try {

    map = L.map("map", {
      zoomControl: true
    }).setView([13.0080, 80.2040], 15);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 19,
        subdomains: "abcd",
        attribution: "© OpenStreetMap, © CARTO"
      }
    ).addTo(map);

    markerLayer = L.layerGroup().addTo(map);
    pathLayer = L.layerGroup().addTo(map);

    map.on("click", function(e) {

      if (!isPinModeActive) return;

      openAddModal();

      document.getElementById("m_lat").value =
        e.latlng.lat.toFixed(6);

      document.getElementById("m_lng").value =
        e.latlng.lng.toFixed(6);

      togglePinMode();
    });

  } catch (error) {

    console.error("Map initialization failed:", error);
    alert("Map initialization failed.");

  }

}


/* =========================================================
   ADD MODAL
   ========================================================= */

function openAddModal() {

  const mobile =
    document.getElementById("mobileSelect").value;

  const ss =
    document.getElementById("ssSelect").value;

  const feeder =
    document.getElementById("feederSelect").value;

  document.getElementById("m_mobile").value =
    mobile || "Mobile-1";

  document.getElementById("m_ss").value =
    ss || "Guindy 110kV SS";

  document.getElementById("m_feeder").value =
    feeder || "Industrial Feeder";

  document.getElementById("assetModal").style.display = "flex";

}


function closeAssetModal() {

  document.getElementById("assetModal").style.display = "none";

}


/* =========================================================
   PIN MODE
   ========================================================= */

function togglePinMode() {

  isPinModeActive = !isPinModeActive;

  const btn =
    document.getElementById("pinToggleBtn");

  if (isPinModeActive) {

    btn.className = "pin-toggle-btn active";

    btn.innerHTML =
      "<span>📍 Tap Map to Pin: ON</span>";

  } else {

    btn.className = "pin-toggle-btn";

    btn.innerHTML =
      "<span>📍 Pin on Map: OFF</span>";

  }

}


/* =========================================================
   SELECT CONTROLS
   ========================================================= */

const mobileSelect =
  document.getElementById("mobileSelect");

const ssSelect =
  document.getElementById("ssSelect");

const feederSelect =
  document.getElementById("feederSelect");


function populateMobiles() {

  const mobiles = [
    ...new Set(
      masterData
        .map(d => String(d.Mobile_Unit || "").trim())
        .filter(Boolean)
    )
  ].sort();

  const current =
    mobileSelect.value;

  mobileSelect.innerHTML =
    '<option value="">-- Choose Mobile --</option>';

  mobiles.forEach(mobile => {

    const option =
      document.createElement("option");

    option.value = mobile;
    option.textContent = mobile;

    mobileSelect.appendChild(option);

  });

  if (mobiles.includes(current)) {

    mobileSelect.value = current;
    populateSubstations(current);

  } else if (mobiles.length > 0) {

    mobileSelect.value = mobiles[0];
    populateSubstations(mobiles[0]);

  } else {

    ssSelect.innerHTML =
      '<option value="">-- Choose SS --</option>';

    feederSelect.innerHTML =
      '<option value="">-- Choose Feeder --</option>';

    ssSelect.disabled = true;
    feederSelect.disabled = true;

  }

}


mobileSelect.addEventListener("change", function() {

  if (!this.value) {

    ssSelect.innerHTML =
      '<option value="">-- Choose SS --</option>';

    feederSelect.innerHTML =
      '<option value="">-- Choose Feeder --</option>';

    ssSelect.disabled = true;
    feederSelect.disabled = true;

    markerLayer.clearLayers();
    pathLayer.clearLayers();

    return;
  }

  populateSubstations(this.value);

});


function populateSubstations(mobile) {

  const substations = [
    ...new Set(
      masterData
        .filter(
          d =>
            String(d.Mobile_Unit || "").trim() === mobile
        )
        .map(
          d =>
            String(d.Substation || "").trim()
        )
        .filter(Boolean)
    )
  ].sort();

  const current =
    ssSelect.value;

  ssSelect.innerHTML =
    '<option value="">-- Choose SS --</option>';

  substations.forEach(ss => {

    const option =
      document.createElement("option");

    option.value = ss;
    option.textContent = ss;

    ssSelect.appendChild(option);

  });

  ssSelect.disabled =
    substations.length === 0;

  if (substations.includes(current)) {

    ssSelect.value = current;
    populateFeeders(mobile, current);

  } else if (substations.length > 0) {

    ssSelect.value = substations[0];

    populateFeeders(
      mobile,
      substations[0]
    );

  } else {

    feederSelect.innerHTML =
      '<option value="">-- Choose Feeder --</option>';

    feederSelect.disabled = true;

  }

}


ssSelect.addEventListener("change", function() {

  if (!this.value) {

    feederSelect.innerHTML =
      '<option value="">-- Choose Feeder --</option>';

    feederSelect.disabled = true;

    return;
  }

  populateFeeders(
    mobileSelect.value,
    this.value
  );

});


function populateFeeders(mobile, ss) {

  const feeders = [
    ...new Set(
      masterData
        .filter(
          d =>
            String(d.Mobile_Unit || "").trim() === mobile &&
            String(d.Substation || "").trim() === ss
        )
        .map(
          d =>
            String(d.Feeder || "").trim()
        )
        .filter(Boolean)
    )
  ].sort();

  const current =
    feederSelect.value;

  feederSelect.innerHTML =
    '<option value="">-- Choose Feeder --</option>';

  feeders.forEach(feeder => {

    const option =
      document.createElement("option");

    option.value = feeder;
    option.textContent = feeder;

    feederSelect.appendChild(option);

  });

  feederSelect.disabled =
    feeders.length === 0;

  if (feeders.includes(current)) {

    feederSelect.value = current;

    renderFeeder(
      mobile,
      ss,
      current
    );

  } else if (feeders.length > 0) {

    feederSelect.value = feeders[0];

    renderFeeder(
      mobile,
      ss,
      feeders[0]
    );

  }

}


feederSelect.addEventListener("change", function() {

  renderFeeder(
    mobileSelect.value,
    ssSelect.value,
    this.value
  );

});


/* =========================================================
   MAP RENDER
   ========================================================= */

function renderFeeder(mobile, ss, feeder) {

  if (!map || !markerLayer || !pathLayer) {
    return;
  }

  markerLayer.clearLayers();
  pathLayer.clearLayers();

  const items =
    masterData
      .filter(
        d =>
          String(d.Mobile_Unit || "").trim() === mobile &&
          String(d.Substation || "").trim() === ss &&
          String(d.Feeder || "").trim() === feeder
      )
      .sort(
        (a, b) =>
          parseFloat(a.Sequence_No || 0) -
          parseFloat(b.Sequence_No || 0)
      );

  if (items.length === 0) {
    return;
  }

  const bounds = [];
  const coords = [];

  items.forEach(item => {

    const lat =
      parseFloat(item.Latitude);

    const lng =
      parseFloat(item.Longitude);

    if (
      Number.isNaN(lat) ||
      Number.isNaN(lng)
    ) {
      return;
    }

    let color = "#1976d2";

    if (item.Asset_Type === "RMU") {
      color = "#d32f2f";
    }

    if (item.Asset_Type === "RMG") {
      color = "#f57c00";
    }

    const marker =
      L.circleMarker(
        [lat, lng],
        {
          radius: 9,
          fillColor: color,
          color: "#fff",
          weight: 2,
          fillOpacity: 0.95
        }
      );

    const popupHTML = `

      <div style="font-size:12px;">

        <b>
          [${escapeHTML(item.Asset_Type || "")}]
          ${escapeHTML(item.Asset_Name || "")}
        </b>

        <br/>

        <b>Path:</b>
        ${escapeHTML(item.Branch || "Main")}

        |

        <b>Seq:</b>
        #${escapeHTML(String(item.Sequence_No || ""))}

        <br/>

        <b>AE:</b>
        ${escapeHTML(item.AE_Section || "N/A")}

        <br/>

        <b>GPS:</b>
        ${lat.toFixed(6)},
        ${lng.toFixed(6)}

        <div style="margin-top:6px;">

          <a
            href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}"
            target="_blank"
            style="
              color:#fff;
              background:#0056b3;
              padding:4px 7px;
              border-radius:3px;
              text-decoration:none;
              font-size:11px;
              display:inline-block;
            "
          >
            Navigate ↗
          </a>

          <button
            onclick="deleteAsset('${escapeJS(item.id)}')"
            style="
              color:#fff;
              background:#c62828;
              border:none;
              padding:4px 7px;
              border-radius:3px;
              font-size:11px;
              cursor:pointer;
              margin-left:4px;
            "
          >
            Delete
          </button>

        </div>

      </div>
    `;

    marker.bindPopup(popupHTML);

    markerLayer.addLayer(marker);

    bounds.push([lat, lng]);
    coords.push([lat, lng]);

  });

  if (coords.length > 1) {

    pathLayer.addLayer(
      L.polyline(
        coords,
        {
          color: "#003366",
          weight: 3.5
        }
      )
    );

  }

  if (bounds.length > 0) {

    map.fitBounds(
      bounds,
      {
        padding: [40, 40]
      }
    );

  }

}


/* =========================================================
   GPS
   ========================================================= */

function fetchCurrentGPS() {

  if (!navigator.geolocation) {

    alert("GPS is not available on this device.");

    return;
  }

  navigator.geolocation.getCurrentPosition(

    position => {

      document.getElementById("m_lat").value =
        position.coords.latitude.toFixed(6);

      document.getElementById("m_lng").value =
        position.coords.longitude.toFixed(6);

      alert("GPS Coordinates Acquired!");

    },

    error => {

      console.error(error);

      alert(
        "Unable to get GPS location.\n\n" +
        "Please enable phone location permission."
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================================================
   SAVE ASSET TO FIREBASE
   ========================================================= */

async function saveAsset() {

  if (isSaving) {
    return;
  }

  const mobile =
    document.getElementById("m_mobile").value.trim();

  const ss =
    document.getElementById("m_ss").value.trim();

  const feeder =
    document.getElementById("m_feeder").value.trim();

  const branch =
    document.getElementById("m_branch").value.trim() ||
    "Main";

  const subbranch =
    document.getElementById("m_subbranch").value.trim();

  const ae =
    document.getElementById("m_ae").value.trim();

  const type =
    document.getElementById("m_type").value;

  const name =
    document.getElementById("m_name").value.trim();

  const seq =
    parseFloat(
      document.getElementById("m_seq").value
    ) || 1;

  const lat =
    parseFloat(
      document.getElementById("m_lat").value
    );

  const lng =
    parseFloat(
      document.getElementById("m_lng").value
    );

  const tie =
    document.getElementById("m_tie").value.trim();

  const remarks =
    document.getElementById("m_remarks").value.trim();


  /* Validation */

  if (
    !mobile ||
    !ss ||
    !feeder ||
    !name ||
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ) {

    alert(
      "Please fill Mobile, SS, Feeder, Asset Name and Coordinates."
    );

    return;
  }


  if (lat < -90 || lat > 90) {

    alert("Invalid latitude.");

    return;
  }


  if (lng < -180 || lng > 180) {

    alert("Invalid longitude.");

    return;
  }


  /* Create unique Firebase key */

  const id =
    "ast_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 8);


  const payload = {

    id: id,

    Mobile_Unit: mobile,

    Substation: ss,

    Feeder: feeder,

    Branch: branch,

    SubBranch: subbranch,

    AE_Section: ae,

    Asset_Type: type,

    Asset_Name: name,

    Sequence_No: seq,

    Latitude: lat,

    Longitude: lng,

    Tie_Feeder: tie,

    Remarks: remarks

  };


  try {

    isSaving = true;

    const saveButton =
      document.querySelector(".btn-save");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";


    /*
      IMPORTANT:
      PUT creates the asset under its own Firebase key.

      This is better than POST here because the same ID
      is used for Add, Update and Delete.
    */

    const firebaseURL =
      FIREBASE_ENDPOINT.replace(
        ".json",
        "/" + encodeURIComponent(id) + ".json"
      );


    const response =
      await fetch(
        firebaseURL,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Firebase returned HTTP " +
        response.status
      );

    }


    /* Save local cache */

    const existingIndex =
      masterData.findIndex(
        item => item.id === id
      );

    if (existingIndex === -1) {

      masterData.push(payload);

    } else {

      masterData[existingIndex] =
        payload;

    }

    localStorage.setItem(
      LOCAL_KEY,
      JSON.stringify(masterData)
    );


    closeAssetModal();

    refreshUI(
      mobile,
      ss,
      feeder
    );


    alert(
      "Asset saved successfully to Firebase!"
    );


  } catch (error) {

    console.error(
      "Firebase save failed:",
      error
    );

    /*
      Do NOT pretend that the asset was saved
      to the cloud.
    */

    alert(
      "Could not save asset to Firebase.\n\n" +
      "Please check your internet connection and Firebase Database rules."
    );

  } finally {

    isSaving = false;

    const saveButton =
      document.querySelector(".btn-save");

    if (saveButton) {

      saveButton.disabled = false;
      saveButton.textContent = "Save";

    }

  }

}


/* =========================================================
   DELETE ASSET
   ========================================================= */

window.deleteAsset = async function(id) {

  if (!id) {
    return;
  }

  if (!confirm("Delete this asset?")) {
    return;
  }


  try {

    const firebaseURL =
      FIREBASE_ENDPOINT.replace(
        ".json",
        "/" + encodeURIComponent(id) + ".json"
      );


    const response =
      await fetch(
        firebaseURL,
        {
          method: "DELETE"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Delete failed: HTTP " +
        response.status
      );

    }


    /*
      Firebase real-time listener will normally
      update masterData automatically.
    */

    masterData =
      masterData.filter(
        item => item.id !== id
      );

    localStorage.setItem(
      LOCAL_KEY,
      JSON.stringify(masterData)
    );


    renderFeeder(
      mobileSelect.value,
      ssSelect.value,
      feederSelect.value
    );


    alert("Asset deleted successfully.");


  } catch (error) {

    console.error(
      "Firebase delete failed:",
      error
    );

    alert(
      "Could not delete asset from Firebase."
    );

  }

};


/* =========================================================
   FIREBASE INITIAL LOAD
   ========================================================= */

async function loadFirebaseData() {

  try {

    const response =
      await fetch(
        FIREBASE_ENDPOINT,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Firebase HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      data &&
      typeof data === "object"
    ) {

      masterData =
        normalizeFirebaseData(data);

      localStorage.setItem(
        LOCAL_KEY,
        JSON.stringify(masterData)
      );

      firebaseReady = true;

      populateMobiles();

      console.log(
        "Firebase data loaded:",
        masterData.length
      );

    } else {

      /*
        Database is empty.

        We use the existing seed locally.
        The seed is NOT automatically uploaded,
        preventing accidental duplicate data.
      */

      masterData =
        getLocalOrSeedData();

      populateMobiles();

      console.log(
        "Firebase database is empty."
      );

    }


    startFirebaseRealtime();

  } catch (error) {

    console.error(
      "Firebase initial load failed:",
      error
    );

    firebaseReady = false;

    masterData =
      getLocalOrSeedData();

    populateMobiles();

    /*
      Still attempt real-time connection.
    */

    startFirebaseRealtime();

  }

}


/* =========================================================
   FIREBASE REAL-TIME STREAM
   ========================================================= */

function startFirebaseRealtime() {

  if (firebaseStream) {

    try {
      firebaseStream.close();
    } catch (e) {}

  }


  /*
    Firebase REST API supports Server-Sent Events.

    This means the browser receives changes from Firebase
    without repeatedly refreshing the page.
  */

  try {

    firebaseStream =
      new EventSource(
        FIREBASE_ENDPOINT
      );


    firebaseStream.addEventListener(
      "put",
      function(event) {
