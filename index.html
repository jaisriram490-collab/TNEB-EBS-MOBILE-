<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#003366">

<title>TNEB Feeder Asset GIS</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Arial,sans-serif;
background:#f4f7fa;
}

body{
overflow:hidden;
}

#app{
height:100vh;
height:100dvh;
display:flex;
flex-direction:column;
}

header{
background:#003366;
color:white;
padding:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}

.title{
font-size:17px;
font-weight:bold;
}

.subtitle{
font-size:10px;
margin-top:2px;
opacity:.85;
}

.actions{
display:flex;
gap:6px;
}

button{
border:none;
border-radius:7px;
padding:9px 11px;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.addBtn{
background:#16a05d;
color:white;
}

.exportBtn{
background:white;
color:#003366;
}

.controls{
background:white;
padding:8px 10px;
border-bottom:1px solid #ddd;
}

.filterGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

label{
display:block;
font-size:11px;
font-weight:bold;
color:#455a64;
margin-bottom:3px;
}

select,
input,
textarea{
width:100%;
padding:8px;
font-size:14px;
border:1px solid #b9c4cc;
border-radius:6px;
background:white;
}

.status{
display:flex;
justify-content:space-between;
font-size:11px;
margin-top:6px;
}

.statusOK{
color:#16864b;
}

.statusError{
color:#c62828;
}

#map{
flex:1;
width:100%;
min-height:300px;
background:#dce6ec;
}

.pinBtn{
position:absolute;
right:12px;
bottom:60px;
z-index:1000;
background:#ff8f00;
color:white;
border-radius:25px;
box-shadow:0 2px 8px #0005;
}

.pinBtn.active{
background:#c62828;
}

.legend{
background:white;
padding:6px 10px;
display:flex;
gap:14px;
flex-wrap:wrap;
font-size:10px;
border-top:1px solid #ddd;
}

.dot{
display:inline-block;
width:10px;
height:10px;
border-radius:50%;
margin-right:3px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:5000;
align-items:center;
justify-content:center;
padding:8px;
}

.modalBox{
width:min(720px,100%);
max-height:96vh;
overflow:auto;
background:white;
border-radius:12px;
}

.modalHeader{
background:#003366;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.modalHeader h3{
margin:0;
}

.closeBtn{
background:none;
color:white;
font-size:24px;
padding:0 5px;
}

.modalBody{
padding:13px;
}

.formGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.full{
grid-column:1/-1;
}

.gpsRow{
display:flex;
gap:6px;
}

.gpsBtn{
background:#1976d2;
color:white;
}

.modalFooter{
padding:10px 13px;
border-top:1px solid #ddd;
display:flex;
justify-content:flex-end;
gap:7px;
}

.cancelBtn{
background:#e7ecef;
}

.saveBtn{
background:#16a05d;
color:white;
}

.noAssets{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:10px 15px;
border-radius:8px;
box-shadow:0 2px 10px #0004;
z-index:500;
font-size:12px;
}

@media(max-width:600px){

.title{
font-size:14px;
}

.subtitle{
font-size:9px;
}

.actions button{
font-size:11px;
padding:8px;
}

.filterGrid{
grid-template-columns:1fr;
}

.formGrid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

}

</style>
</head>

<body>

<div id="app">

<header>

<div>

<div class="title">
TNEB Feeder Asset GIS
</div>

<div class="subtitle">
RMG • RMU • Structure
</div>

</div>

<div class="actions">

<button
class="addBtn"
onclick="openAddModal()">
➕ Add
</button>

<button
class="exportBtn"
onclick="exportCSV()">
💾 Export
</button>

</div>

</header>


<div class="controls">

<div class="filterGrid">

<div>

<label>Mobile</label>

<select id="mobileSelect">
<option value="">All</option>
</select>

</div>


<div>

<label>Substation</label>

<select id="ssSelect">
<option value="">All</option>
</select>

</div>


<div>

<label>Feeder</label>

<select id="feederSelect">
<option value="">All</option>
</select>

</div>

</div>


<div class="status">

<span id="assetCount">
Assets: 0
</span>

<span id="firebaseStatus">
Connecting...
</span>

</div>

</div>


<div id="map"></div>


<div
id="noAssets"
class="noAssets">

No mapped assets.

</div>


<button
id="pinBtn"
class="pinBtn"
onclick="togglePinMode()">

📍 Pin on Map

</button>


<div class="legend">

<span>
<i
class="dot"
style="background:#1976d2">
</i>
RMG
</span>

<span>
<i
class="dot"
style="background:#e53935">
</i>
RMU
</span>

<span>
<i
class="dot"
style="background:#43a047">
</i>
Structure
</span>

</div>


<!-- MODAL -->

<div
id="assetModal"
class="modal">

<div class="modalBox">

<div class="modalHeader">

<h3 id="modalTitle">
Add Asset
</h3>

<button
class="closeBtn"
onclick="closeModal()">
×
</button>

</div>


<div class="modalBody">

<div class="formGrid">

<input
type="hidden"
id="assetId">


<div>

<label>Mobile</label>

<input
id="m_mobile"
placeholder="Mobile-1">

</div>


<div>

<label>Substation</label>

<input
id="m_ss"
placeholder="Guindy 110kV SS">

</div>


<div>

<label>Feeder</label>

<input
id="m_feeder"
placeholder="Industrial Feeder">

</div>


<div>

<label>Branch</label>

<input
id="m_branch">

</div>


<div>

<label>Sub Branch</label>

<input
id="m_subbranch">

</div>


<div>

<label>AE Section</label>

<input
id="m_ae">

</div>


<div>

<label>Asset Type</label>

<select id="m_type">

<option value="RMG">
RMG
</option>

<option value="RMU">
RMU
</option>

<option value="Structure">
Structure
</option>

</select>

</div>


<div>

<label>Asset Name / Number</label>

<input
id="m_name"
placeholder="RMG-001">

</div>


<div>

<label>Sequence</label>

<input
id="m_seq"
type="number"
min="0">

</div>


<div>

<label>Tie Feeder</label>

<input
id="m_tie">

</div>


<div class="full">

<label>GPS Coordinates</label>

<div class="gpsRow">

<input
id="m_lat"
type="number"
step="any"
placeholder="Latitude">

<input
id="m_lng"
type="number"
step="any"
placeholder="Longitude">

<button
class="gpsBtn"
onclick="getGPS()">

📍 GPS

</button>

</div>

</div>


<div class="full">

<label>Remarks</label>

<textarea
id="m_remarks"
rows="3">
</textarea>

</div>

</div>

</div>


<div class="modalFooter">

<button
class="cancelBtn"
onclick="closeModal()">

Cancel

</button>


<button
class="saveBtn"
onclick="saveAsset()">

💾 Save

</button>

</div>

</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==========================================
   FIREBASE
========================================== */

const FIREBASE_URL =
"https://tneb-gis-70e97-default-rtdb.asia-southeast1.firebasedatabase.app";

const FIREBASE_PATH =
"/tneb_network_assets";


/* ==========================================
   VARIABLES
========================================== */

let assets = [];

let map = null;

let markerLayer = null;

let lineLayer = null;

let pinMode = false;

let firebaseStream = null;


/* ==========================================
   SHORT ID FUNCTION
========================================== */

function $(id){

return document.getElementById(id);

}


/* ==========================================
   CREATE ID
========================================== */

function createID(){

return "asset_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,8);

}


/* ==========================================
   NUMBER
========================================== */

function numberValue(value){

const n = Number(value);

return Number.isFinite(n)
? n
: null;

}


/* ==========================================
   NORMALIZE ASSET
========================================== */

function normalizeAsset(data,key){

data = data || {};

return {

id:String(
data.id ||
key ||
createID()
),

mobile:String(
data.mobile ||
"Mobile-1"
),

ss:String(
data.ss ||
data.substation ||
""
),

feeder:String(
data.feeder ||
""
),

branch:String(
data.branch ||
""
),

subbranch:String(
data.subbranch ||
""
),

ae:String(
data.ae ||
data.aeSection ||
""
),

type:
data.type === "RMU"
?
"RMU"
:
data.type === "Structure"
?
"Structure"
:
"RMG",

name:String(
data.name ||
data.assetName ||
""
),

seq:
numberValue(
data.seq ||
data.sequence
) || 0,

lat:
numberValue(
data.lat ||
data.latitude
),

lng:
numberValue(
data.lng ||
data.longitude
),

tie:String(
data.tie ||
data.tieFeeder ||
""
),

remarks:String(
data.remarks ||
""
)

};

}


/* ==========================================
   STATUS
========================================== */

function setFirebaseStatus(
message,
success
){

$("firebaseStatus").textContent =
message;

$("firebaseStatus").className =
success
?
"statusOK"
:
"statusError";

}


/* ==========================================
   LOCAL STORAGE
========================================== */

function saveLocal(){

try{

localStorage.setItem(
"tneb_assets",
JSON.stringify(assets)
);

}catch(error){

console.log(error);

}

}


function loadLocal(){

try{

const data =
JSON.parse(
localStorage.getItem(
"tneb_assets"
) || "[]"
);

if(Array.isArray(data)){

return data.map(
(item,index)=>
normalizeAsset(
item,
item.id ||
"local_"+index
)
);

}

}catch(error){

console.log(error);

}

return [];

}


/* ==========================================
   MAP
========================================== */

function initializeMap(){

map =
L.map(
"map"
).setView(
[13.0080,80.2040],
14
);


/*
OpenStreetMap
*/

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:19,

attribution:
"&copy; OpenStreetMap contributors"

}
).addTo(map);


markerLayer =
L.layerGroup()
.addTo(map);


lineLayer =
L.layerGroup()
.addTo(map);


map.on(
"click",
function(event){

if(!pinMode){

return;

}


openAddModal();


$("m_lat").value =
event.latlng.lat.toFixed(6);


$("m_lng").value =
event.latlng.lng.toFixed(6);


togglePinMode();

}
);


/*
Important for mobile
*/

setTimeout(
function(){

map.invalidateSize();

},
500
);

}


/* ==========================================
   ASSET COLOR
========================================== */

function assetColor(type){

if(type === "RMG"){

return "#1976d2";

}

if(type === "RMU"){

return "#e53935";

}

if(type === "Structure"){

return "#43a047";

}

return "#fb8c00";

}


/* ==========================================
   FILTER OPTIONS
========================================== */

function fillSelect(
id,
values,
oldValue
){

const select =
$(id);

const unique =
[
...new Set(
values
.filter(Boolean)
)
].sort();


select.innerHTML =
'<option value="">All</option>';


unique.forEach(
function(value){

const option =
document.createElement(
"option"
);

option.value =
value;

option.textContent =
value;

select.appendChild(
option
);

}
);


if(
unique.includes(oldValue)
){

select.value =
oldValue;

}

}


/* ==========================================
   FILTERS
========================================== */

function updateFilters(){

const mobile =
$("mobileSelect").value;

const ss =
$("ssSelect").value;

const feeder =
$("feederSelect").value;


fillSelect(
"mobileSelect",
assets.map(
asset =>
asset.mobile
),
mobile
);


const selectedMobile =
$("mobileSelect").value;


fillSelect(
"ssSelect",

assets
.filter(
asset =>
!selectedMobile ||
asset.mobile ===
selectedMobile
)
.map(
asset =>
asset.ss
),

ss
);


const selectedSS =
$("ssSelect").value;


fillSelect(
"feederSelect",

assets
.filter(
asset =>
(!selectedMobile ||
asset.mobile ===
selectedMobile)
&&
(!selectedSS ||
asset.ss ===
selectedSS)
)
.map(
asset =>
asset.feeder
),

feeder
);

}


/* ==========================================
   SELECTED ASSETS
========================================== */

function getSelectedAssets(){

const mobile =
$("mobileSelect").value;

const ss =
$("ssSelect").value;

const feeder =
$("feederSelect").value;


return assets.filter(
function(asset){

return

(!mobile ||
asset.mobile === mobile)

&&

(!ss ||
asset.ss === ss)

&&

(!feeder ||
asset.feeder === feeder);

}
);

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==========================================
   RENDER MAP
========================================== */

function renderMap(){

if(!map){

return;

}


markerLayer.clearLayers();

lineLayer.clearLayers();


const selected =
getSelectedAssets();


const mapped =
selected.filter(
asset =>
asset.lat !== null &&
asset.lng !== null
);


$("assetCount").textContent =
"Assets: " +
selected.length +
" | Mapped: " +
mapped.length;


$("noAssets").style.display =
mapped.length
?
"none"
:
"block";


mapped.forEach(
function(asset){

const marker =
L.circleMarker(
[
asset.lat,
asset.lng
],
{

radius:9,

color:"#ffffff",

weight:2,

fillColor:
assetColor(
asset.type
),

fillOpacity:.95

}
);


const popup =

"<b>" +
escapeHTML(
asset.name ||
asset.type
) +
"</b>" +

"<br>Type: " +
escapeHTML(
asset.type
) +

"<br>Mobile: " +
escapeHTML(
asset.mobile
) +

"<br>Substation: " +
escapeHTML(
asset.ss
) +

"<br>Feeder: " +
escapeHTML(
asset.feeder
) +

"<br>Branch: " +
escapeHTML(
asset.branch
) +

"<br>Sequence: " +
escapeHTML(
asset.seq
) +

"<br>Latitude: " +
asset.lat.toFixed(6) +

"<br>Longitude: " +
asset.lng.toFixed(6) +

"<br><br>" +

"<button onclick=\"editAsset('" +
asset.id +
"')\">✏️ Edit</button> " +

"<button onclick=\"deleteAsset('" +
asset.id +
"')\">🗑️ Delete</button>";


marker
.bindPopup(popup)
.addTo(markerLayer);

}
);


/*
Draw feeder route
*/

const ordered =
[...mapped].sort(
(a,b)=>
Number(a.seq) -
Number(b.seq)
);


if(
ordered.length > 1
){

L.polyline(
ordered.map(
asset =>
[
asset.lat,
asset.lng
]
),
{

weight:3,

opacity:.65

}
).addTo(lineLayer);

}


/*
Zoom to assets
*/

if(mapped.length){

map.fitBounds(
mapped.map(
asset =>
[
asset.lat,
asset.lng
]
),
{

padding:[
30,
30
],

maxZoom:17

}
);

}


setTimeout(
function(){

map.invalidateSize();

},
200
);

}


/* ==========================================
   REFRESH
========================================== */

function refresh(){

updateFilters();

renderMap();

}


/* ==========================================
   OPEN ADD
========================================== */

function openAddModal(){

$("modalTitle").textContent =
"Add Asset";


$("assetId").value =
"";


$("m_mobile").value =
$("mobileSelect").value ||
"Mobile-1";


$("m_ss").value =
$("ssSelect").value ||
"";


$("m_feeder").value =
$("feederSelect").value ||
"";


$("m_branch").value =
"";

$("m_subbranch").value =
"";

$("m_ae").value =
"";

$("m_type").value =
"RMG";

$("m_name").value =
"";

$("m_seq").value =
"";

$("m_lat").value =
"";

$("m_lng").value =
"";

$("m_tie").value =
"";

$("m_remarks").value =
"";


$("assetModal").style.display =
"flex";

}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal(){

$("assetModal").style.display =
"none";

}


/* ==========================================
   EDIT
========================================== */

function editAsset(id){

const asset =
assets.find(
item =>
item.id === id
);


if(!asset){

alert(
"Asset not found."
);

return;

}


$("modalTitle").textContent =
"Edit Asset";


$("assetId").value =
asset.id;


$("m_mobile").value =
asset.mobile;

$("m_ss").value =
asset.ss;

$("m_feeder").value =
asset.feeder;

$("m_branch").value =
asset.branch;

$("m_subbranch").value =
asset.subbranch;

$("m_ae").value =
asset.ae;

$("m_type").value =
asset.type;

$("m_name").value =
asset.name;

$("m_seq").value =
asset.seq;

$("m_lat").value =
asset.lat ?? "";

$("m_lng").value =
asset.lng ?? "";

$("m_tie").value =
asset.tie;

$("m_remarks").value =
asset.remarks;


$("assetModal").style.display =
"flex";

}


/* ==========================================
   SAVE
========================================== */

async function saveAsset(){

const id =
$("assetId").value.trim() ||
createID();


const lat =
numberValue(
$("m_lat").value
);


const lng =
numberValue(
$("m_lng").value
);


if(
!$("m_name").value.trim()
){

alert(
"Enter Asset Name / Number."
);

return;

}


if(
lat === null ||
lng === null
){

alert(
"Enter valid Latitude and Longitude."
);

return;

}


if(
lat < -90 ||
lat > 90 ||
lng < -180 ||
lng > 180
){

alert(
"Invalid coordinates."
);

return;

}


const asset =
normalizeAsset(
{

id:id,

mobile:
$("m_mobile").value.trim()
||
"Mobile-1",

ss:
$("m_ss").value.trim(),

feeder:
$("m_feeder").value.trim(),

branch:
$("m_branch").value.trim(),

subbranch:
$("m_subbranch").value.trim(),

ae:
$("m_ae").value.trim(),

type:
$("m_type").value,

name:
$("m_name").value.trim(),

seq:
$("m_seq").value,

lat:lat,

lng:lng,

tie:
$("m_tie").value.trim(),

remarks:
$("m_remarks").value.trim()

},
id
);


const index =
assets.findIndex(
item =>
item.id === id
);


if(index >= 0){

assets[index] =
asset;

}else{

assets.push(
asset
);

}


saveLocal();

refresh();

closeModal();


/*
Firebase
*/

try{

const response =
await fetch(
FIREBASE_URL +
FIREBASE_PATH +
"/" +
encodeURIComponent(id) +
".json",
{

method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(asset)

}
);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


setFirebaseStatus(
"Firebase: Saved",
true
);


}catch(error){

console.error(
error
);


setFirebaseStatus(
"Firebase save failed",
false
);


alert(
"Saved on this device, but Firebase could not be updated."
);

}

}


/* ==========================================
   DELETE
========================================== */

async function deleteAsset(id){

const asset =
assets.find(
item =>
item.id === id
);


if(!asset){

return;

}


if(
!confirm(
"Delete " +
asset.name +
"?"
)
){

return;

}


assets =
assets.filter(
item =>
item.id !== id
);


saveLocal();

refresh();


try{

const response =
await fetch(
FIREBASE_URL +
FIREBASE_PATH +
"/" +
encodeURIComponent(id) +
".json",
{

method:"DELETE"

}
);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


setFirebaseStatus(
"Firebase: Deleted",
true
);


}catch(error){

console.error(
error
);

setFirebaseStatus(
"Firebase delete failed",
false
);

}

}


/* ==========================================
   GPS
========================================== */

function getGPS(){

if(
!navigator.geolocation
){

alert(
"GPS is not supported."
);

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

$("m_lat").value =
position.coords.latitude
.toFixed(6);


$("m_lng").value =
position.coords.longitude
.toFixed(6);

},

function(error){

alert(
"GPS error: " +
error.message
);

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* ==========================================
   PIN MODE
========================================== */

function togglePinMode(){

pinMode =
!pinMode;


$("pinBtn").classList.toggle(
"active",
pinMode
);


$("pinBtn").textContent =
