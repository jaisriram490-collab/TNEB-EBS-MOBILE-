<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNEB Test</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #fff; }
    #log { background: #111; color: #0f0; padding: 12px; font-family: monospace; font-size: 13px; border-radius: 6px; min-height: 120px; white-space: pre-wrap; }
    .btn { background: #003366; color: #fff; padding: 12px 18px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; margin-top: 15px; width: 100%; }
    #map { width: 100%; height: 250px; background: #ccc; margin-top: 15px; border-radius: 6px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script>
    // Catch every single error and print it on screen
    window.onerror = function(msg, url, line) {
      document.getElementById('log').innerHTML += '\n❌ ERROR: ' + msg + ' (Line: ' + line + ')';
      return false;
    };
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <h3>TNEB GIS Diagnostic Test</h3>
  <div id="log">Testing system...</div>
  <button class="btn" onclick="testClick()">Tap to Test Add Modal</button>
  <div id="map"></div>

  <script>
    function print(text) {
      document.getElementById('log').innerHTML += '\n' + text;
    }

    try {
      print('1. Checking Leaflet library...');
      if (typeof L !== 'undefined') {
        print('✅ Leaflet is loaded successfully.');
        print('2. Initializing test map...');
        var map = L.map('map').setView([13.0080, 80.2040], 14);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        print('✅ Map engine initialized successfully.');
      } else {
        print('❌ Leaflet library failed to load from internet.');
      }
    } catch(e) {
      print('❌ Map error: ' + e.message);
    }

    function testClick() {
      alert('Button click works perfectly!');
      print('✅ Tap event detected.');
    }
  </script>
</body>
</html>
