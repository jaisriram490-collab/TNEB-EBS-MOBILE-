<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TNEB Feeder Asset GIS Navigator</title>

  <!-- Leaflet CSS (High-Performance CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous" />
  <!-- PapaParse for CSV Bulk Handling -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; }

    #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; }

    /* Header Bar */
    header {
      background: #003366; color: #fff; padding: 8px 12px;
      display: flex; justify-content: space-between; align-items: center;
      height: 50px; flex-shrink: 0; z-index: 1000;
    }
    header h1 { font-size: 0.90rem; font-weight: 700; letter-spacing: 0.5px; }
    .header-actions { display: flex; gap: 5px; }
    .btn-hdr {
      background: #ff9800; border: none; color: #111; font-weight: 700;
      padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    }
    .btn-hdr:active { transform: scale(0.96); }

    /* Strict 3-Tier Cascading Controls: Mobile -> SS -> Feeder */
    .controls-grid {
      background: #ffffff; padding: 8px 10px;
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
      border-bottom: 1px solid #dcdcdc; flex-shrink: 0; z-index: 1000;
    }
    .control-item label {
      display: block; font-size: 0.62rem; font-weight: 800; color: #555;
      text-transform: uppercase; margin-bottom: 2px;
    }
    select, input[type="text"] {
      width: 100%; padding: 6px 4px; font-size: 0.78rem;
      border: 1px solid #aaa; border-radius: 4px; background: #fff; outline: none;
    }
    select:disabled { background: #e9ecef; color: #888; border-color: #ccc; }

    /* Map Viewport */
    #map {
      flex: 1 1 auto; width: 100%; height: calc(100vh - 105px); min-height: 250px;
      background: #e5e3df; z-index: 1;
    }
    .leaflet-tile { image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }

    /* Pinning Sensitivity Toggle */
    .pin-toggle-btn {
      position: absolute; top: 115px; right: 12px; z-index: 999;
      background: #ffffff; border: 2px solid #003366; color: #003366;
      font-weight: 800; font-size: 0.75rem; padding: 7px 11px; border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .pin-toggle-btn.active { background: #d32f2f; color: #ffffff; border-color: #d32f2f; }

    /* Legend */
    .legend-bar {
      position: absolute; bottom: 10px; left: 8px; right: 8px;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(4px);
      padding: 6px 8px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex; justify-content: space-around; font-size: 0.68rem; font-weight: 700; z-index: 999;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.rmu { background: #d32f2f; }
    .dot.rmg { background: #f57c00; }
    .dot.structure { background: #1976d2; }
    .dot.tie { background: #ffd700; border: 2px solid #b71c1c; }

    /* Modal Styling */
    #assetModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      z-index: 99999; justify-content: center; align-items: center; padding: 12px;
    }
    .modal-box {
      background: #fff; width: 100%; max-width: 430px; max-height: 90vh;
      overflow-y: auto; padding: 14px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .modal-box h3 { font-size: 0.95rem; color: #003366; margin-bottom: 8px; }
    .gps-btn {
      width: 100%; background: #0288d1; color: white; border: none; font-weight: 700;
      padding: 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-bottom: 8px;
    }
    .section-title {
      font-size: 0.68rem; font-weight: 800; color: #003366; background: #e3f2fd;
      padding: 3px 6px; border-radius: 3px; margin: 6px 0 4px 0; text-transform: uppercase;
    }
    .form-group { margin-bottom: 5px; }
    .form-group label { display: block; font-size: 0.65rem; font-weight: 700; color: #444; }
    .coords-row { display: flex; gap: 6px; }
    .coords-row input { flex: 1; }
    .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
    .modal-btns button {
      flex: 1; padding: 9px; border: none; border-radius: 4px; font-weight: 700;
      font-size: 0.8rem; cursor: pointer;
    }
    .btn-save { background: #2e7d32; color: #fff; }
    .btn-cancel { background: #757575; color: #fff; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>TNEB GIS Navigator</h1>
      <div class="header-actions">
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
        <button class="btn-hdr" onclick="document.getElementById('csvFileInput').click()">📁 Import</button>
        <button class="btn-hdr" onclick="openAddModal()">➕ Add</button>
        <button class="btn-hdr" onclick="exportCSV()">💾 Export</button>
      </div>
    </header>

    <!-- 3-Tier Cascading Hierarchy -->
    <div class="controls-grid">
      <div class="control-item">
        <label for="mobileSelect">1. Mobile Unit</label>
        <select id="mobileSelect"><option value="">-- Choose Mobile --</option></select>
      </div>
      <div class="control-item">
        <label for="ssSelect">2. Substation (SS)</label>
        <select id="ssSelect" disabled><option value="">-- Choose SS --</option></select>
      </div>
      <div class="control-item">
        <label for="feederSelect">3. Feeder</label>
        <select id="feederSelect" disabled><option value="">-- Choose Feeder --</option></select>
      </div>
    </div>

    <!-- Map Viewport -->
    <div id="map"></div>

    <!-- Pinning Sensitivity Toggle -->
    <button class="pin-toggle-btn" id="pinToggleBtn" onclick="togglePinMode()">
      <span>📍 Pin on Map: OFF</span>
    </button>

    <div class="legend-bar">
      <div class="legend-item"><span class="dot rmu"></span> RMU</div>
      <div class="legend-item"><span class="dot rmg"></span> RMG</div>
      <div class="legend-item"><span class="dot structure"></span> Structure</div>
      <div class="legend-item"><span class="dot tie"></span> Tie Point</div>
    </div>
  </div>

  <!-- Asset Modal -->
  <div id="assetModal">
    <div class="modal-box">
      <h3 id="modalTitle">Add Network Asset</h3>
      <input type="hidden" id="edit_id" value="" />
      <button type="button" class="gps-btn" onclick="fetchCurrentGPS()">📍 Auto-Fill Current GPS</button>

      <div class="section-title">1. Mobile Unit & Substation Hierarchy</div>
      <div class="form-group"><label>Mobile Unit *</label><input type="text" id="m_mobile" placeholder="e.g., Mobile-1" /></div>
      <div class="form-group"><label>Substation (SS) Name *</label><input type="text" id="m_ss" placeholder="e.g., Guindy 110kV SS" /></div>
      <div class="form-group"><label>Feeder Name *</label><input type="text" id="m_feeder" placeholder="e.g., Industrial Feeder" /></div>

      <div class="section-title">2. Routing Path (Main, Branch, Sub-Branch)</div>
      <div class="coords-row">
        <div class="form-group" style="flex:1;">
          <label>Branch / Path</label>
          <input type="text" id="m_branch" value="Main" placeholder="Main, Branch-1" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Sub-Branch</label>
          <input type="text" id="m_subbranch" placeholder="Sub-A (Optional)" />
        </div>
      </div>

      <div class="section-title">3. Equipment Specs & Position</div>
      <div class="coords-row">
        <div class="form-group" style="flex:1;">
          <label>AE Section</label>
          <input type="text" id="m_ae" placeholder="e.g., AE/Guindy" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Asset Type *</label>
          <select id="m_type">
            <option value="RMU">RMU</option>
            <option value="RMG">RMG</option>
            <option value="Structure">Structure / DP</option>
          </select>
        </div>
      </div>

      <div class="form-group"><label>Asset Name / Number *</label><input type="text" id="m_name" placeholder="e.g., RMU 01 (Post Office)" /></div>
      <div class="form-group"><label>Sequence Number</label><input type="number" step="any" id="m_seq" value="1" /></div>
      <div class="form-group">
        <label>Coordinates (Latitude, Longitude) *</label>
        <div class="coords-row">
          <input type="number" step="any" id="m_lat" placeholder="13.0080" />
          <input type="number" step="any" id="m_lng" placeholder="80.2040" />
        </div>
      </div>

      <div class="section-title">4. Tie Switch Information (Optional)</div>
      <div class="coords-row">
        <div class="form-group" style="flex:1;"><label>Tie Feeder</label><input type="text" id="m_tie_feeder" placeholder="Race Course Feeder" /></div>
        <div class="form-group" style="flex:1;"><label>Tie Substation</label><input type="text" id="m_tie_ss" placeholder="Saidapet 33kV SS" /></div>
      </div>
      <div class="form-group"><label>Remarks</label><input type="text" id="m_remarks" placeholder="3-Way SF6" /></div>

      <div class="modal-btns">
        <button type="button" class="btn-cancel" onclick="closeAssetModal()">Cancel</button>
        <button type="button" class="btn-save" id="btnSaveAsset" onclick="saveAsset()">Save</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JavaScript Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>

  <script>
    // -------------------------------------------------------------
    // 1. Direct Cloud REST API Endpoint (100% Reliable, Zero SDK Block)
    // -------------------------------------------------------------
    const DB_URL = "https://tneb-gis-70e97-default-rtdb.asia-southeast1.firebasedatabase.app/tneb_network_assets";

    const defaultSeed = [
      { id: "ast_1", Mobile_Unit: "Mobile-1", Substation: "Guindy 110kV SS", Feeder: "Industrial Feeder", Branch: "Main", SubBranch: "", AE_Section: "AE/Guindy", Asset_Type: "RMU", Asset_Name: "RMU 01 (Post Office)", Sequence_No: 1, Latitude: 13.0080, Longitude: 80.2040, Tie_Feeder: "", Tie_SS: "", Remarks: "3-Way SF6" },
      { id: "ast_2", Mobile_Unit: "Mobile-1", Substation: "Guindy 110kV SS", Feeder: "Industrial Feeder", Branch: "Main", SubBranch: "", AE_Section: "AE/Guindy", Asset_Type: "Structure", Asset_Name: "DP Pole 04", Sequence_No: 2, Latitude: 13.0092, Longitude: 80.2052, Tie_Feeder: "", Tie_SS: "", Remarks: "250kVA DT" },
      { id: "ast_3", Mobile_Unit: "Mobile-2", Substation: "Saidapet 33kV SS", Feeder: "Bazaar Feeder", Branch: "Main", SubBranch: "", AE_Section: "AE/Saidapet", Asset_Type: "RMU", Asset_Name: "RMU 02 (Cross Tie)", Sequence_No: 1, Latitude: 13.0118, Longitude: 80.2078, Tie_Feeder: "Industrial Feeder", Tie_SS: "Guindy 110kV SS", Remarks: "Normally Open Tie" }
    ];

    let masterData = JSON.parse(localStorage.getItem('tneb_local_cache')) || defaultSeed;

    // -------------------------------------------------------------
    // 2. Leaflet Map Initialization
    // -------------------------------------------------------------
    const map = L.map('map', { zoomControl: true }).setView([13.0080, 80.2040], 14);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      detectRetina: true,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);
    setTimeout(() => { map.invalidateSize(); }, 800);

    const markerLayer = L.layerGroup().addTo(map);
    const pathLayer = L.layerGroup().addTo(map);

    // -------------------------------------------------------------
    // 3. Medium-Sensitivity Pinning Toggle
    // -------------------------------------------------------------
    let isPinModeActive = false;
    let touchTimer = null;

    function togglePinMode() {
      isPinModeActive = !isPinModeActive;
      const btn = document.getElementById('pinToggleBtn');
      if (isPinModeActive) {
        btn.classList.add('active');
        btn.innerHTML = '<span>📍 Tap Map to Pin: ON</span>';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>📍 Pin on Map: OFF</span>';
      }
    }

    map.on('click', function(e) {
      if (!isPinModeActive) return;
      openAddModal();
      document.getElementById('m_lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('m_lng').value = e.latlng.lng.toFixed(6);
      togglePinMode();
    });

    map.on('mousedown', function(e) {
      touchTimer = setTimeout(() => {
        openAddModal();
        document.getElementById('m_lat').value = e.latlng.lat.toFixed(6);
        document.getElementById('m_lng').value = e.latlng.lng.toFixed(6);
      }, 750);
    });
    map.on('mouseup mousemove zoomstart', function() {
      if (touchTimer) clearTimeout(touchTimer);
    });

    // -------------------------------------------------------------
    // 4. Cloud Synchronisation via Native REST API
    // -------------------------------------------------------------
    async function loadCloudData() {
      try {
        const res = await fetch(`${DB_URL}.json`);
        const data = await res.json();
        if (data) {
          masterData = Object.keys(data).map(key => ({ ...data[key], id: key }));
        } else {
          // If fresh database, initialize with seed
          for (let item of defaultSeed) {
            await fetch(`${DB_URL}.json`, { method: 'POST', body: JSON.stringify(item) });
          }
          masterData = defaultSeed;
        }
        localStorage.setItem('tneb_local_cache', JSON.stringify(masterData));
      } catch (err) {
        console.warn("Using offline cached data:", err);
      }
      populateMobiles();
      renderActiveFeeder();
    }

    // -------------------------------------------------------------
    // 5. Strict Cascading: Mobile -> SS (A-Z) -> Feeder (A-Z)
    // -------------------------------------------------------------
    const mobileSelect = document.getElementById('mobileSelect');
    const ssSelect = document.getElementById('ssSelect');
    const feederSelect = document.getElementById('feederSelect');

    function populateMobiles() {
      const currentMobile = mobileSelect.value;
      const mobiles = [...new Set(masterData.map(d => (d.Mobile_Unit || '').trim()))]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b));

      mobileSelect.innerHTML = '<option value="">-- Choose Mobile --</option>';
      mobiles.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m;
        mobileSelect.appendChild(opt);
      });

      if (currentMobile && mobiles.includes(currentMobile)) {
        mobileSelect.value = currentMobile;
        populateSubstations(currentMobile);
      } else {
        ssSelect.innerHTML = '<option value="">-- Choose SS --</option>';
        ssSelect.disabled = true;
        feederSelect.innerHTML = '<option value="">-- Choose Feeder --</option>';
        feederSelect.disabled = true;
      }
    }

    mobileSelect.addEventListener('change', function() {
      const selectedMobile = this.value;
      markerLayer.clearLayers();
      pathLayer.clearLayers();

      if (!selectedMobile) {
        ssSelect.innerHTML = '<option value="">-- Choose SS --</option>';
        ssSelect.disabled = true;
        feederSelect.innerHTML = '<option value="">-- Choose Feeder --</option>';
        feederSelect.disabled = true;
        return;
      }
      populateSubstations(selectedMobile);
    });

    function populateSubstations(mobileName) {
      const currentSS = ssSelect.value;
      const substations = [...new Set(
        masterData.filter(d => (d.Mobile_Unit || '').trim() === mobileName).map(d => (d.Substation || '').trim())
      )].filter(Boolean).sort((a, b) => a.localeCompare(b));

      ssSelect.innerHTML = '<option value="">-- Choose SS --</option>';
      substations.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        ssSelect.appendChild(opt);
      });
      ssSelect.disabled = false;

      if (currentSS && substations.includes(currentSS)) {
        ssSelect.value = currentSS;
        populateFeeders(mobileName, currentSS);
      } else {
        feederSelect.innerHTML = '<option value="">-- Choose Feeder --</option>';
        feederSelect.disabled = true;
      }
    }

    ssSelect.addEventListener('change', function() {
      const selectedSS = this.value;
      markerLayer.clearLayers();
      pathLayer.clearLayers();

      if (!selectedSS) {
        feederSelect.innerHTML = '<option value="">-- Choose Feeder --</option>';
        feederSelect.disabled = true;
        return;
      }
      populateFeeders(mobileSelect.value, selectedSS);
    });

    function populateFeeders(mobileName, ssName) {
      const currentFeeder = feederSelect.value;
      const feeders = [...new Set(
        masterData.filter(d => (d.Mobile_Unit || '').trim() === mobileName && (d.Substation || '').trim() === ssName)
                  .map(d => (d.Feeder || '').trim())
      )].filter(Boolean).sort((a, b) => a.localeCompare(b));

      feederSelect.innerHTML = '<option value="">-- Choose Feeder --</option>';
      feeders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f; opt.textContent = f;
        feederSelect.appendChild(opt);
      });
      feederSelect.disabled = false;

      if (currentFeeder && feeders.includes(currentFeeder)) {
        feederSelect.value = currentFeeder;
        renderActiveFeeder();
      }
    }

    feederSelect.addEventListener('change', () => renderActiveFeeder());

    function renderActiveFeeder() {
      renderFeeder(mobileSelect.value, ssSelect.value, feederSelect.value);
    }

    // -------------------------------------------------------------
    // 6. Feeder Assets & Sub-Branch Tracing
    // -------------------------------------------------------------
    function renderFeeder(mobileName, ssName, feederName) {
      markerLayer.clearLayers();
      pathLayer.clearLayers();

      if (!mobileName || !ssName || !feederName) return;

      const assets = masterData
        .filter(d => (d.Mobile_Unit || '').trim() === mobileName &&
                     (d.Substation || '').trim() === ssName &&
                     (d.Feeder || '').trim() === feederName)
        .sort((a, b) => parseFloat(a.Sequence_No) - parseFloat(b.Sequence_No));

      if (assets.length === 0) return;

      const bounds = [];

      assets.forEach(item => {
        const lat = parseFloat(item.Latitude);
        const lng = parseFloat(item.Longitude);
        if (isNaN(lat) || isNaN(lng)) return;

        let color = '#1976d2';
        const typeUpper = (item.Asset_Type || '').toUpperCase();
        if (typeUpper === 'RMU') color = '#d32f2f';
        else if (typeUpper === 'RMG') color = '#f57c00';

        const hasTie = item.Tie_Feeder && item.Tie_Feeder.trim().length > 0;

        const marker = L.circleMarker([lat, lng], {
          radius: hasTie ? 11 : 9,
          fillColor: color,
          color: hasTie ? '#ffd700' : '#ffffff',
          weight: hasTie ? 3.5 : 2,
          fillOpacity: 0.95
        });

        const tieBoxHtml = hasTie ? `
