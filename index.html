<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003366">
<title>TNEB Feeder Asset GIS</title>

<!-- Leaflet -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#f4f7fa;
}

body{overflow:hidden}

#app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

header{
    background:#003366;
    color:white;
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    z-index:1000;
}

.title{
    font-weight:bold;
    font-size:17px;
}

.sub{
    font-size:10px;
    opacity:.85;
    margin-top:2px;
}

.actions{
    display:flex;
    gap:6px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 11px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.add{
    background:#16a05d;
    color:white;
}

.export{
    background:white;
    color:#003366;
}

.controls{
    background:white;
    padding:8px 10px;
    border-bottom:1px solid #d5dce2;
    z-index:900;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

label{
    display:block;
    font-size:11px;
    font-weight:bold;
    color:#455a64;
    margin-bottom:3px;
}

select,
input,
textarea{
    width:100%;
    padding:8px;
    border:1px solid #b9c4cc;
    border-radius:6px;
    font-size:14px;
    background:white;
}

.status{
    display:flex;
    justify-content:space-between;
    margin-top:6px;
    font-size:11px;
    color:#546e7a;
}

.ok{color:#16864b}
.err{color:#c62828}

/* IMPORTANT: map must have a real height */
#map{
    flex:1;
    width:100%;
    min-height:300px;
    background:#dce6ec;
}

.pin{
    position:absolute;
    right:12px;
    bottom:58px;
    z-index:900;
    background:#ff8f00;
    color:white;
    border-radius:22px;
    box-shadow:0 2px 8px #0005;
}

.pin.active{
    background:#c62828;
}

.legend{
    background:white;
    border-top:1px solid #d5dce2;
    padding:6px 9px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-size:10px;
    z-index:800;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    margin-right:3px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:3000;
    align-items:center;
    justify-content:center;
    padding:8px;
}

.box{
    background:white;
    border-radius:11px;
    width:min(720px,100%);
    max-height:96dvh;
    overflow:auto;
    box-shadow:0 12px 35px #0008;
}

.mhead{
    background:#003366;
    color:white;
    padding:11px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.mhead h3{
    margin:0;
    font-size:17px;
}

.close{
    background:transparent;
    color:white;
    font-size:24px;
    padding:0 4px;
}

.body{
    padding:13px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.full{
    grid-column:1/-1;
}

.gps{
    display:flex;
    gap:6px;
}

.gps button{
    background:#1976d2;
    color:white;
    white-space:nowrap;
}

.footer{
    padding:10px 13px;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:flex-end;
    gap:7px;
}

.cancel{
    background:#e7ecef;
}

.save{
    background:#16a05d;
    color:white;
}

.empty{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:500;
    background:white;
    padding:10px 14px;
    border-radius:8px;
    box-shadow:0 2px 10px #0003;
    font-size:12px;
}

.popup-title{
    font-weight:bold;
    color:#003366;
    margin-bottom:4px;
}

.popup-row{
    font-size:12px;
    margin:2px 0;
}

.popup-buttons{
    display:flex;
    gap:5px;
    margin-top:7px;
}

.popup-buttons button{
    font-size:11px;
    padding:6px 8px;
}

@media(max-width:600px){

    .title{
        font-size:14px;
    }

    .sub{
        font-size:9px;
    }

    .actions button{
        font-size:11px;
        padding:8px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<div id="app">

<header>

    <div>
        <div class="title">
            TNEB Feeder Asset GIS
        </div>

        <div class="sub">
            RMG • RMU • Structure | Firebase Real-Time
        </div>
    </div>

    <div class="actions">

        <button class="add" onclick="openAddModal()">
            ➕ Add
        </button>

        <button class="export" onclick="exportData()">
            💾 Export
        </button>

    </div>

</header>


<div class="controls">

    <div class="grid">

        <div>
            <label>Mobile</label>
            <select id="mobileSelect"></select>
        </div>

        <div>
            <label>Substation</label>
            <select id="ssSelect"></select>
        </div>

        <div>
            <label>Feeder</label>
            <select id="feederSelect"></select>
        </div>

    </div>

    <div class="status">

        <span id="count">
            Assets: 0
        </span>

        <span id="fbStatus">
            Connecting...
        </span>

    </div>

</div>


<div id="map"></div>

<div id="empty" class="empty">
    No mapped assets for this selection.
</div>


<button
id="pinBtn"
class="pin"
onclick="togglePin()">
📍 Pin on Map
</button>


<div class="legend">

    <span>
        <i class="dot" style="background:#1976d2"></i>
        RMG
    </span>

    <span>
        <i class="dot" style="background:#e53935"></i>
        RMU
    </span>

    <span>
        <i class="dot" style="background:#43a047"></i>
        Structure
    </span>

    <span>
        <i class="dot" style="background:#fb8c00"></i>
        Other
    </span>

</div>


<!-- ADD / EDIT MODAL -->

<div id="modal" class="modal">

    <div class="box">

        <div class="mhead">

            <h3 id="modalTitle">
                Add Asset
            </h3>

            <button
            class="close"
            onclick="closeModal()">
                ×
            </button>

        </div>


        <div class="body">

            <div class="form">

                <input
                type="hidden"
                id="m_id">


                <div>
                    <label>Mobile</label>
                    <input
                    id="m_mobile"
                    placeholder="Mobile-1">
                </div>


                <div>
                    <label>Substation</label>
                    <input
                    id="m_ss"
                    placeholder="Guindy 110kV SS">
                </div>


                <div>
                    <label>Feeder</label>
                    <input
                    id="m_feeder"
                    placeholder="Industrial Feeder">
                </div>


                <div>
                    <label>Branch</label>
                    <input id="m_branch">
                </div>


                <div>
                    <label>Sub Branch</label>
                    <input id="m_subbranch">
                </div>


                <div>
                    <label>AE Section</label>
                    <input id="m_ae">
                </div>


                <div>

                    <label>
                        Asset Type
                    </label>

                    <select id="m_type">

                        <option value="RMG">
                            RMG
                        </option>

                        <option value="RMU">
                            RMU
                        </option>

                        <option value="Structure">
                            Structure
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Asset Name / Number
                    </label>

                    <input
                    id="m_name"
                    required
                    placeholder="RMG-001">

                </div>


                <div>

                    <label>
                        Sequence
                    </label>

                    <input
                    id="m_seq"
                    type="number"
                    min="0">

                </div>


                <div>

                    <label>
                        Tie Feeder
                    </label>

                    <input id="m_tie">

                </div>


                <div class="full">

                    <label>
                        GPS Coordinates
                    </label>

                    <div class="gps">

                        <input
                        id="m_lat"
                        type="number"
                        step="any"
                        placeholder="Latitude"
                        required>

                        <input
                        id="m_lng"
                        type="number"
                        step="any"
                        placeholder="Longitude"
                        required>

                        <button onclick="getGPS()">
                            📍 GPS
                        </button>

                    </div>

                </div>


                <div class="full">

                    <label>
                        Remarks
                    </label>

                    <textarea
                    id="m_remarks"
                    rows="3"></textarea>

                </div>

            </div>

        </div>


        <div class="footer">

            <button
            class="cancel"
            onclick="closeModal()">
                Cancel
            </button>

            <button
            class="save"
            onclick="saveAsset()">
                💾 Save Asset
            </button>

        </div>

    </div>

</div>


<!-- Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

"use strict";


/* ============================================
   FIREBASE
============================================ */

const FIREBASE_URL =
"https://tneb-gis-70e97-default-rtdb.asia-southeast1.firebasedatabase.app";

const FIREBASE_PATH =
"/tneb_network_assets";


let assets = [];

let map = null;

let markers = null;

let lines = null;

let firebaseStream = null;

let pinMode = false;


/* ============================================
   HELPER
============================================ */

function $(id){

    return document.getElementById(id);

}


function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function numberValue(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : null;

}


function createID(){

    return "ast_" +
    Date.now() +
    "_" +
    Math.random()
    .toString(36)
    .substring(2,8);

}


function normalizeAsset(asset,key){

    asset = asset || {};

    return {

        id:String(
            asset.id ||
            key ||
            createID()
        ),

        mobile:String(
            asset.mobile ||
            "Mobile-1"
        ),

        ss:String(
            asset.ss ||
            asset.substation ||
            ""
        ),

        feeder:String(
            asset.feeder ||
            ""
        ),

        branch:String(
            asset.branch ||
            ""
        ),

        subbranch:String(
            asset.subbranch ||
            ""
        ),

        ae:String(
            asset.ae ||
            asset.aeSection ||
            ""
        ),

        type:
        ["RMG","RMU","Structure","Other"]
        .includes(asset.type)
        ?
        asset.type
        :
        "Other",

        name:String(
            asset.name ||
            asset.assetName ||
            ""
        ),

        seq:
        numberValue(
            asset.seq ||
            asset.sequence
        ) || 0,

        lat:
        numberValue(
            asset.lat ||
            asset.latitude
        ),

        lng:
        numberValue(
            asset.lng ||
            asset.longitude
        ),

        tie:String(
            asset.tie ||
            asset.tieFeeder ||
            ""
        ),

        remarks:String(
            asset.remarks ||
            ""
        )

    };

}


/* ============================================
   STATUS
============================================ */

function setStatus(message,good){

    $("fbStatus").textContent =
    message;

    $("fbStatus").className =
    good ? "ok" : "err";

}


/* ============================================
   LOCAL CACHE
============================================ */

function saveCache(){

    try{

        localStorage.setItem(
            "tneb_assets",
            JSON.stringify(assets)
        );

    }catch(error){

        console.log(error);

    }

}


function loadCache(){

    try{

        const data =
        JSON.parse(
            localStorage.getItem(
                "tneb_assets"
            ) || "[]"
        );

        if(Array.isArray(data)){

            return data.map(
                (asset,index)=>
                normalizeAsset(
                    asset,
                    asset.id ||
                    "cache_"+index
                )
            );

        }

    }catch(error){

        console.log(error);

    }

    return [];

}


/* ============================================
   MAP INITIALIZATION
============================================ */

function initializeMap(){

    map =
    L.map(
        "map",
        {
            zoomControl:true
        }
    ).setView(
        [13.0080,80.2040],
        14
    );


    /*
       OpenStreetMap
       No API key required
    */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {

            maxZoom:19,

            attribution:
            "&copy; OpenStreetMap contributors"

        }
    ).addTo(map);


    markers =
    L.layerGroup()
    .addTo(map);


    lines =
    L.layerGroup()
    .addTo(map);


    map.on(
        "click",
        function(event){

            if(!pinMode){

                return;

            }


            openAddModal();


            $("m_lat").value =
            event.latlng.lat.toFixed(6);


            $("m_lng").value =
            event.latlng.lng.toFixed(6);


            togglePin();

        }
    );


    /*
       Important for mobile browsers
    */

    setTimeout(
        function(){

            map.invalidateSize();

        },
        500
    );

}


/* ============================================
   FILTERS
============================================ */

function fillSelect(
    elementID,
    values,
    currentValue
){

    const element =
    $(elementID);


    const unique =
    [
        ...new Set(
            values
            .filter(Boolean)
            .map(String)
        )
    ].sort();


    element.innerHTML =
    '<option value="">All</option>';


    unique.forEach(
        function(value){

            const option =
            document.createElement(
                "option"
            );

            option.value =
            value;

            option.textContent =
            value;

            element.appendChild(
                option
            );

        }
    );


    if(
        unique.includes(
            currentValue
        )
    ){

        element.value =
        currentValue;

    }

}


function updateFilters(){

    const mobile =
    $("mobileSelect").value;

    const ss =
    $("ssSelect").value;

    const feeder =
    $("feederSelect").value;


    fillSelect(
        "mobileSelect",
        assets.map(
            asset=>asset.mobile
        ),
        mobile
    );


    const selectedMobile =
    $("mobileSelect").value;


    fillSelect(
        "ssSelect",

        assets
        .filter(
            asset =>
            !selectedMobile ||
            asset.mobile === selectedMobile
        )
        .map(
            asset=>asset.ss
        ),

        ss
    );


    const selectedSS =
    $("ssSelect").value;


    fillSelect(
        "feederSelect",

        assets
        .filter(
            asset =>
            (!selectedMobile ||
             asset.mobile === selectedMobile)

            &&

            (!selectedSS ||
             asset.ss === selectedSS)
        )
        .map(
            asset=>asset.feeder
        ),

        feeder
    );

}


function getSelectedAssets(){

    const mobile =
    $("mobileSelect").value;

    const ss =
    $("ssSelect").value;

    const feeder =
    $("feederSelect").value;


    return assets.filter(
        function(asset){

            return

            (!mobile ||
             asset.mobile === mobile)

            &&

            (!ss ||
             asset.ss === ss)

            &&

            (!feeder ||
             asset.feeder === feeder);

        }
    );

}


/* ============================================
   ASSET COLORS
============================================ */

function assetColor(type){

    if(type === "RMG"){

        return "#1976d2";

    }

    if(type === "RMU"){

        return "#e53935";

    }

    if(type === "Structure"){

        return "#43a047";

    }

    return "#fb8c00";

}


/* ============================================
   RENDER MAP
============================================ */

function renderMap(){

    if(!map){

        return;

    }


    markers.clearLayers();

    lines.clearLayers();


    const selected =
    getSelectedAssets();


    const mapped =
    selected.filter(
        asset =>
        asset.lat !== null &&
        asset.lng !== null
    );


    $("count").textContent =
    "Assets: " +
    selected.length +
    " | Mapped: " +
    mapped.length;


    $("empty").style.display =
    mapped.length
    ?
    "none"
    :
    "block";


    mapped.forEach(
        function(asset){

            const marker =
            L.circleMarker(
                [
                    asset.lat,
                    asset.lng
                ],
                {

                    radius:9,

                    color:"#ffffff",

                    weight:2,

                    fillColor:
                    assetColor(
                        asset.type
                    ),

                    fillOpacity:.95

                }
            );


            const popup =

            '<div class="popup-title">' +

            escapeHTML(
                asset.name ||
                asset.type
            ) +

            '</div>' +

            '<div class="popup-row">' +
            '<b>Type:</b> ' +
            escapeHTML(asset.type) +
            '</div>' +

            '<div class="popup-row">' +
            '<b>Mobile:</b> ' +
            escapeHTML(asset.mobile) +
            '</div>' +

            '<div class="popup-row">' +
            '<b>Substation:</b> ' +
            escapeHTML(asset.ss) +
            '</div>' +

            '<div class="popup-row">' +
            '<b>Feeder:</b> ' +
            escapeHTML(asset.feeder) +
            '</div>' +

            '<div class="popup-row">' +
            '<b>Branch:</b> ' +
            escapeHTML(asset.branch) +
            '</div>' +

            '<div class="popup-row">' +
            '<b>Sequence:</b> ' +
            escapeHTML(asset.seq) +
            '</div>' +

            '
