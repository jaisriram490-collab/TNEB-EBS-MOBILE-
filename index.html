<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TNEB Feeder Asset GIS Navigator</title>

  <!-- Leaflet CSS via Cloudflare CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous" />
  <!-- CSV Parser Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    header {
      background: #003366;
      color: #fff;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      flex-shrink: 0;
      z-index: 1000;
    }

    header h1 { font-size: 0.90rem; font-weight: bold; }
    .header-actions { display: flex; gap: 5px; }
    .btn-hdr {
      background: #ff9800; border: none; color: #111; font-weight: bold;
      padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.72rem;
    }

    .controls {
      background: #ffffff;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      height: 58px;
      border-bottom: 1px solid #ccc;
      flex-shrink: 0;
      z-index: 1000;
    }

    .select-box label {
      display: block; font-size: 0.65rem; font-weight: bold; color: #555;
      text-transform: uppercase; margin-bottom: 2px;
    }

    select {
      width: 100%; padding: 5px; font-size: 0.82rem;
      border: 1px solid #aaa; border-radius: 4px; background: #fff; outline: none;
    }

    /* Fixed Height for Map Container on Mobile */
    #map {
      flex: 1 1 auto;
      width: 100%;
      height: calc(100vh - 110px);
      background: #f2efe9;
      z-index: 1;
    }

    /* Fixes blur on high-resolution smartphone screens */
    .leaflet-tile {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .legend-bar {
      position: absolute; bottom: 12px; left: 10px; right: 10px;
      background: rgba(255, 255, 255, 0.95); padding: 7px 10px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; justify-content: space-around;
      font-size: 0.72rem; font-weight: bold; z-index: 999;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.rmu { background: #d32f2f; }
    .dot.rmg { background: #f57c00; }
    .dot.structure { background: #1976d2; }
    .dot.tie { background: #ffd700; border: 2px solid #b71c1c; }

    /* Modal Form Overlay */
    #assetModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 999999;
      justify-content: center; align-items: center; padding: 12px;
    }
    .modal-box {
      background: #fff; width: 100%; max-width: 400px; max-height: 85vh;
      overflow-y: auto; padding: 14px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .modal-box h3 { font-size: 0.95rem; color: #003366; margin-bottom: 8px; }
    .gps-btn {
      width: 100%; background: #0288d1; color: white; border: none; font-weight: bold;
      padding: 9px; border-radius: 4px; font-size: 0.78rem; cursor: pointer; margin-bottom: 8px;
    }
    .form-group { margin-bottom: 6px; }
    .form-group label { display: block; font-size: 0.68rem; font-weight: bold; color: #444; }
    .form-group input, .form-group select {
      width: 100%; padding: 6px; font-size: 0.8rem; border: 1px solid #ccc;
      border-radius: 4px; margin-top: 2px;
    }
    .coords-row { display: flex; gap: 6px; }
    .coords-row input { flex: 1; }
    .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
    .modal-btns button {
      flex: 1; padding: 9px; border: none; border-radius: 4px; font-weight: bold;
      font-size: 0.85rem; cursor: pointer;
    }
    .btn-save { background: #2e7d32; color: #fff; }
    .btn-cancel { background: #757575; color: #fff; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>TNEB GIS</h1>
      <div class="header-actions">
        <!-- Hidden CSV File Input -->
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
        <button class="btn-hdr" onclick="document.getElementById('csvFileInput').click()">📁 Import</button>
        <button class="btn-hdr" onclick="openAddModal()">➕ Add</button>
        <button class="btn-hdr" onclick="exportCSV()">💾 Export</button>
      </div>
    </header>

    <div class="controls">
      <div class="select-box">
        <label for="ssSelect">Substation (SS)</label>
        <select id="ssSelect"><option value="">-- Substation --</option></select>
      </div>
      <div class="select-box">
        <label for="feederSelect">Feeder</label>
        <select id="feederSelect" disabled><option value="">-- Feeder --</option></select>
      </div>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <div class="legend-bar">
      <div class="legend-item"><span class="dot rmu"></span> RMU</div>
      <div class="legend-item"><span class="dot rmg"></span> RMG</div>
      <div class="legend-item"><span class="dot structure"></span> Structure</div>
      <div class="legend-item"><span class="dot tie"></span> Tie Point</div>
    </div>
  </div>

  <!-- Form Modal -->
  <div id="assetModal">
    <div class="modal-box">
      <h3 id="modalTitle">Add Network Asset</h3>
      <input type="hidden" id="edit_index" value="-1" />
      <button type="button" class="gps-btn" onclick="fetchCurrentGPS()">📍 Get Current Location (GPS)</button>

      <div class="form-group"><label>Substation Name *</label><input type="text" id="m_ss" placeholder="Guindy 110kV SS" /></div>
      <div class="form-group"><label>Feeder Name *</label><input type="text" id="m_feeder" placeholder="Industrial Feeder" /></div>
      <div class="form-group"><label>Branch / Path</label><input type="text" id="m_branch" value="Main" /></div>
      <div class="coords-row">
        <div class="form-group" style="flex:1;"><label>AE Section</label><input type="text" id="m_ae" placeholder="AE/Guindy" /></div>
        <div class="form-group" style="flex:1;"><label>Mobile Unit</label><input type="text" id="m_mobile" placeholder="Mobile-1" /></div>
      </div>
      <div class="form-group">
        <label>Asset Type *</label>
        <select id="m_type">
          <option value="RMU">RMU</option>
          <option value="RMG">RMG</option>
          <option value="Structure">Structure / DP</option>
        </select>
      </div>
      <div class="form-group"><label>Asset Name *</label><input type="text" id="m_name" placeholder="RMU 01" /></div>
      <div class="form-group"><label>Sequence Number</label><input type="number" step="any" id="m_seq" value="1" /></div>
      <div class="form-group">
        <label>Coordinates (Lat, Lng) *</label>
        <div class="coords-row">
          <input type="number" step="any" id="m_lat" placeholder="13.0080" />
          <input type="number" step="any" id="m_lng" placeholder="80.2040" />
        </div>
      </div>
      <div class="form-group"><label>Tie Feeder (Optional)</label><input type="text" id="m_tie_feeder" placeholder="Leave empty if internal" /></div>
      <div class="form-group"><label>Remarks</label><input type="text" id="m_remarks" placeholder="3-Way SF6" /></div>

      <div class="modal-btns">
        <button type="button" class="btn-cancel" onclick="closeAssetModal()">Cancel</button>
        <button type="button" class="btn-save" id="btnSaveAsset" onclick="saveAsset()">Save</button>
      </div>
    </div>
  </div>

  <!-- Leaflet Script via Cloudflare CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>

  <script>
    const defaultData = [
      { Substation: "Guindy SS", Feeder: "Industrial Feeder", Branch: "Main", AE_Section: "AE/Guindy", Mobile_Unit: "Mobile-1", Asset_Type: "RMU", Asset_Name: "RMU 01", Sequence_No: 1, Latitude: 13.0080, Longitude: 80.2040, Tie_Feeder: "", Remarks: "3-Way SF6" },
      { Substation: "Guindy SS", Feeder: "Industrial Feeder", Branch: "Main", AE_Section: "AE/Guindy", Mobile_Unit: "Mobile-1", Asset_Type: "Structure", Asset_Name: "DP 01", Sequence_No: 2, Latitude: 13.0092, Longitude: 80.2052, Tie_Feeder: "", Remarks: "250kVA DT" },
      { Substation: "Guindy SS", Feeder: "Industrial Feeder", Branch: "Main", AE_Section: "AE/Guindy", Mobile_Unit: "Mobile-2", Asset_Type: "RMU", Asset_Name: "RMU 02 (Tie)", Sequence_No: 3, Latitude: 13.0118, Longitude: 80.2078, Tie_Feeder: "Race Course Feeder", Remarks: "Tie Switch" }
    ];

    let stored = localStorage.getItem('tneb_asset_v8');
    let masterData = stored ? JSON.parse(stored) : defaultData;

    function persistData() {
      localStorage.setItem('tneb_asset_v8', JSON.stringify(masterData));
    }

    const map = L.map('map', {
      zoomControl: true,
      fadeAnimation: false,
      zoomSnap: 0.5
    }).setView([13.0080, 80.2040], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      detectRetina: true,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    window.addEventListener('load', () => {
      setTimeout(() => { map.invalidateSize(); }, 300);
      setTimeout(() => { map.invalidateSize(); }, 800);
    });

    const markerLayer = L.layerGroup().addTo(map);
    const pathLayer = L.layerGroup().addTo(map);

    map.on('click', function(e) {
      openAddModal();
      document.getElementById('m_lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('m_lng').value = e.latlng.lng.toFixed(6);
    });

    const ssSelect = document.getElementById('ssSelect');
    const feederSelect = document.getElementById('feederSelect');

    function populateDropdowns() {
      const substations = [...new Set(masterData.map(d => (d.Substation || '').trim()))].filter(Boolean);
      ssSelect.innerHTML = '<option value="">-- Substation --</option>';
      substations.forEach(ss => {
        const opt = document.createElement('option');
        opt.value = ss;
        opt.textContent = ss;
        ssSelect.appendChild(opt);
      });
      feederSelect.innerHTML = '<option value="">-- Feeder --</option>';
      feederSelect.disabled = true;
    }

    ssSelect.addEventListener('change', function() {
      const selectedSS = this.value;
      feederSelect.innerHTML = '<option value="">-- Feeder --</option>';
      markerLayer.clearLayers();
      pathLayer.clearLayers();

      if (!selectedSS) {
        feederSelect.disabled = true;
        return;
      }

      const feeders = [...new Set(masterData.filter(d => (d.Substation || '').trim() === selectedSS).map(d => (d.Feeder || '').trim()))].filter(Boolean);
      feeders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        feederSelect.appendChild(opt);
      });
      feederSelect.disabled = false;
    });

    feederSelect.addEventListener('change', function() {
      renderFeeder(ssSelect.value, this.value);
    });

    function renderFeeder(ssName, feederName) {
      markerLayer.clearLayers();
      pathLayer.clearLayers();
      if (!feederName) return;

      const matchedAssets = [];
      masterData.forEach((item, originalIndex) => {
        if ((item.Substation || '').trim() === ssName && (item.Feeder || '').trim() === feederName) {
          matchedAssets.push({ ...item, _masterIndex: originalIndex });
        }
      });

      matchedAssets.sort((a, b) => parseFloat(a.Sequence_No) - parseFloat(b.Sequence_No));
      if (matchedAssets.length === 0) return;

      const bounds = [];
      const pathCoords = [];

      matchedAssets.forEach(item => {
        const lat = parseFloat(item.Latitude);
        const lng = parseFloat(item.Longitude);
        if (isNaN(lat) || isNaN(lng)) return;

        let color = '#1976d2';
        const typeUpper = (item.Asset_Type || '').toUpperCase();
        if (typeUpper === 'RMU') color = '#d32f2f';
        else if (typeUpper === 'RMG') color = '#f57c00';

        const hasTie = item.Tie_Feeder && item.Tie_Feeder.trim().length > 0;

        const marker = L.circleMarker([lat, lng], {
          radius: hasTie ? 11 : 9,
          fillColor: color,
          color: hasTie ? '#ffd700' : '#ffffff',
          weight: hasTie ? 3 : 2,
          fillOpacity: 0.95
        });

        marker.bindPopup(`
          <div style="font-size:12px; line-height:1.4;">
            <b style="color:${color}; font-size:13px;">[${item.Asset_Type}] ${item.Asset_Name}</b><br/>
            <b>AE:</b> ${item.AE_Section || 'N/A'} | <b>Mobile:</b> ${item.Mobile_Unit || 'N/A'}<br/>
            ${hasTie ? `<b style="color:orange;">Tie to: ${item.Tie_Feeder}</b><br/>` : ''}
            <b>GPS:</b> ${lat.toFixed(5)}, ${lng.toFixed(5)}<br/>
            <button onclick="deleteAsset(${item._masterIndex})" style="color:white; background:#c62828; border:none; padding:3px 6px; border-radius:3px; margin-top:5px; cursor:pointer;">Delete</button>
          </div>
        `);

        markerLayer.addLayer(marker);
        bounds.push([lat, lng]);
        pathCoords.push([lat, lng]);
      });

      if (pathCoords.length > 1) {
        pathLayer.addLayer(L.polyline(pathCoords, { color: '#003366', weight: 3 }));
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    function openAddModal() {
      document.getElementById('assetModal').style.display = 'flex';
      if (ssSelect.value) document.getElementById('m_ss').value = ssSelect.value;
      if (feederSelect.value) document.getElementById('m_feeder').value = feederSelect.value;
    }

    function closeAssetModal() {
      document.getElementById('assetModal').style.display = 'none';
    }

    function fetchCurrentGPS() {
      if (!navigator.geolocation) {
        alert("GPS not supported.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          document.getElementById('m_lat').value = pos.coords.latitude.toFixed(6);
          document.getElementById('m_lng').value = pos.coords.longitude.toFixed(6);
          alert("GPS Location Saved!");
        },
        err => alert("GPS Permission Denied. Please enable GPS in Android settings.")
      );
    }

    function saveAsset() {
      const ss = document.getElementById('m_ss').value.trim();
      const feeder = document.getElementById('m_feeder').value.trim();
      const branch = document.getElementById('m_branch').value.trim() || 'Main';
      const ae = document.getElementById('m_ae').value.trim();
      const mobile = document.getElementById('m_mobile').value.trim();
      const type = document.getElementById('m_type').value;
      const name = document.getElementById('m_name').value.trim();
      const seq = parseFloat(document.getElementById('m_seq').value) || 1;
      const lat = parseFloat(document.getElementById('m_lat').value);
      const lng = parseFloat(document.getElementById('m_lng').value);
      const tieFeeder = document.getElementById('m_tie_feeder').value.trim();
      const remarks = document.getElementById('m_remarks').value.trim();

      if (!ss || !feeder || !name) {
        alert("Please enter Substation, Feeder, and Asset Name.");
        return;
      }
      if (isNaN(lat) || isNaN(lng)) {
        alert("Coordinates missing! Click on the map or tap Get Location.");
        return;
      }

      masterData.push({
        Substation: ss, Feeder: feeder, Branch: branch, AE_Section: ae,
        Mobile_Unit: mobile, Asset_Type: type, Asset_Name: name,
        Sequence_No: seq, Latitude: lat, Longitude: lng, Tie_Feeder: tieFeeder, Remarks: remarks
      });

      persistData();
      closeAssetModal();
      populateDropdowns();

      ssSelect.value = ss;
      ssSelect.dispatchEvent(new Event('change'));
      feederSelect.value = feeder;
      renderFeeder(ss, feeder);
    }

    window.deleteAsset = function(index) {
      if (confirm("Delete this asset?")) {
        masterData.splice(index, 1);
        persistData();
        populateDropdowns();
        renderFeeder(ssSelect.value, feederSelect.value);
      }
    };

    // CSV File Import Handler
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            masterData = results.data;
            persistData();
            populateDropdowns();
            alert(`Imported ${masterData.length} network records successfully!`);
          } else {
            alert("No valid rows found in CSV file.");
          }
        }
      });
    });

    // CSV File Export Handler
    function exportCSV() {
      let csv = "Substation,Feeder,Branch,AE_Section,Mobile_Unit,Asset_Type,Asset_Name,Sequence_No,Latitude,Longitude,Tie_Feeder,Remarks\n";
      masterData.forEach(d => {
        csv += `"${d.Substation}","${d.Feeder}","${d.Branch || ''}","${d.AE_Section || ''}","${d.Mobile_Unit || ''}","${d.Asset_Type}","${d.Asset_Name}",${d.Sequence_No},${d.Latitude},${d.Longitude},"${d.Tie_Feeder || ''}","${d.Remarks || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "tneb_assets.csv";
      a.click();
    }

    populateDropdowns();

    // Auto-select initial sample
    if (ssSelect.options.length > 1) {
      ssSelect.selectedIndex = 1;
      ssSelect.dispatchEvent(new Event('change'));
      if (feederSelect.options.length > 1) {
        feederSelect.selectedIndex = 1;
        feederSelect.dispatchEvent(new Event('change'));
      }
    }
  </script>
</body>
</html>
